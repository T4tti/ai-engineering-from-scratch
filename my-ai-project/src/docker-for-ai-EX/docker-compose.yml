services:
  ai-runtime:
    build:
      context: .
      dockerfile: dockerfile
    command: ["python", "-c", "import time; time.sleep(2147483647)"]
    volumes:
      - ../:/workspace

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
