# Docker-compose file 
# run ai-env:runtime and qdrant at the same time using docker-compose


services:
  ai-runtime:
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ../:/workspace
    ports:
    - "5000:5000"
    stdin_open: true
    tty: true
    command: /bin/bash

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
